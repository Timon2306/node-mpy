[package]
name = "node-teal"
version = "1.0.0"
description = "Node-TEAL - MicroPython Visual Flow Studio"
authors = ["Node-TEAL Team"]
edition = "2021"

[lib]
name = "node_teal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
